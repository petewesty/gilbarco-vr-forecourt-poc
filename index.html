<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Gilbarco Veeder-Root VR Forecourt Training - Navigable POC</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
    #ui { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.75); padding: 12px; border-radius: 8px; z-index: 100; max-width: 340px; }
    button { margin: 4px 0; padding: 8px; width: 100%; cursor: pointer; background: #0066CC; color: white; border: none; border-radius: 4px; }
    button:hover { background: #0055AA; }
    #module-info, #nav-info { font-size: 13px; margin-top: 6px; }
  </style>
</head>
<body>
  <div id="ui">
    <h3 style="margin:0 0 8px 0;">Gilbarco VR Forecourt Training</h3>
    <div>
      <button onclick="setRegion('australia')">Australia (SK700-II)</button>
      <button onclick="setRegion('india')">India</button>
      <button onclick="setRegion('thailand')">Thailand</button>
      <button onclick="setRegion('southafrica')">South Africa</button>
    </div>
    <p id="status" style="margin:8px 0; font-weight:bold;">Region: Australia</p>
    <div>
      <button onclick="startModule(1)">Module 1: Hazard Awareness</button>
      <button onclick="startModule(2)">Module 2: Dispenser Isolation</button>
      <button onclick="startModule(3)">Module 3: Confined Space Prep</button>
      <button onclick="startModule(4)">Module 4: ATG Inspection</button>
      <button onclick="startModule(5)">Module 5: Working at Heights</button>
    </div>
    <div id="nav-info"><strong>Navigation:</strong> WASD to move • Mouse to look • Click objects</div>
    <div id="module-info">Explore the forecourt sections to find hazards.</div>
  </div>

  <a-scene renderer="antialias: true" background="color: #87CEEB">
    <a-entity id="rig" position="0 1.6 8">
      <a-camera look-controls wasd-controls cursor="rayOrigin: mouse; fuse: false">
        <a-cursor color="yellow"></a-cursor>
      </a-camera>
    </a-entity>

    <!-- Large Ground -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="60" height="60" color="#4A4A4A" material="roughness:0.9"></a-plane>

    <!-- Section Labels (floating) -->
    <a-text value="DISPENSER ISLAND" position="0 3 -2" align="center" color="#FFF" width="6"></a-text>
    <a-text value="TANK AREA" position="8 2.5 -10" align="center" color="#FFF" width="5"></a-text>
    <a-text value="ATG / ELECTRICAL" position="-8 2.5 -10" align="center" color="#FFF" width="5"></a-text>
    <a-text value="HEIGHTS / CANOPY" position="0 7 -2" align="center" color="#FFD700" width="5"></a-text>

    <!-- Island surface -->
    <a-plane position="0 0.02 -2" rotation="-90 0 0" width="12" height="16" color="#2A2A2A"></a-plane>

    <!-- Canopy (spans island) -->
    <a-box id="canopy" position="0 4.5 -2" width="16" height="0.4" depth="12" color="#0066CC"></a-box>
    <a-box position="-7 2.6 -2" width="0.4" height="5.2" depth="0.4" color="#333"></a-box>
    <a-box position="7 2.6 -2" width="0.4" height="5.2" depth="0.4" color="#333"></a-box>

    <!-- Dispenser Section -->
    <a-entity id="dispenser" position="0 1.3 -2" class="clickable" data-hazard="explosive" data-section="island">
      <a-box width="1.4" height="2.4" depth="0.7" color="#E0E0E0"></a-box>
      <a-text value="SK700-II" position="0 0.9 0.36" align="center" color="#111" width="1.6"></a-text>
    </a-entity>

    <!-- Tank Area (further back/right) -->
    <a-entity id="manway" position="8 0.25 -10" class="clickable" data-hazard="confined" data-section="tank">
      <a-cylinder radius="0.8" height="0.4" color="#777"></a-cylinder>
      <a-text value="Tank Sump / Manway" position="0 0.7 0" align="center" color="#FFF" width="2.4"></a-text>
    </a-entity>
    <a-cylinder position="8 0.1 -12" radius="0.3" height="1.5" color="#555"></a-cylinder>

    <!-- ATG / Electrical Section (further back/left) -->
    <a-entity id="atg" position="-8 1.1 -10" class="clickable" data-hazard="electrical" data-section="atg">
      <a-box width="1" height="1.8" depth="0.6" color="#1A1A1A"></a-box>
      <a-text value="ATG Console" position="0 0.6 0.31" align="center" color="#00FF00" width="1.5"></a-text>
    </a-entity>

    <!-- Heights access -->
    <a-entity id="heights" position="0 6.5 -2" class="clickable" data-hazard="heights" data-section="heights">
      <a-box width="1.5" height="0.3" depth="1.5" color="#FFD700"></a-box>
      <a-text value="Canopy Access" position="0 0.4 0" align="center" color="#FFF" width="2.2"></a-text>
    </a-entity>

    <!-- Traffic / Exclusion (near island edge) -->
    <a-entity id="traffic" position="-4 0.5 2" class="clickable" data-hazard="traffic" data-section="island">
      <a-cone radius-bottom="0.45" radius-top="0.05" height="0.9" color="#FF6600"></a-cone>
      <a-text value="Exclusion Zone" position="0 0.7 0" align="center" color="#FFF" width="2"></a-text>
    </a-entity>

    <!-- Simple path markers -->
    <a-box position="4 0.05 -6" width="0.3" height="0.1" depth="6" color="#666"></a-box>
    <a-box position="-4 0.05 -6" width="0.3" height="0.1" depth="6" color="#666"></a-box>

    <a-light type="ambient" color="#FFFFFF" intensity="0.65"></a-light>
    <a-light type="directional" color="#FFFFFF" intensity="0.75" position="-2 4 3"></a-light>

    <!-- Feedback Panel -->
    <a-entity id="panel" position="0 2.3 3" visible="false">
      <a-plane width="3.6" height="2.5" color="#111" opacity="0.95"></a-plane>
      <a-text id="panel-title" value="" position="0 0.9 0.01" align="center" color="#FFF" width="3.2"></a-text>
      <a-text id="panel-body" value="" position="0 0.1 0.01" align="center" color="#CCC" width="3.2"></a-text>
      <a-text id="panel-feedback" value="" position="0 -0.8 0.01" align="center" color="#0F0" width="3.2"></a-text>
    </a-entity>
  </a-scene>

  <script>
    const hazards = {
      explosive: { title: "Explosive Atmosphere / Fuel Vapours", controls: "• Pre-start risk assessment\n• Gas testing\n• Ex-rated tools & lighting\n• No ignition sources\n• Exclusion zones" },
      confined: { title: "Confined Space (Tank Sump / Manway)", controls: "• Pre-start risk assessment\n• Confined space entry permit\n• Gas testing (LEL / O₂)\n• Ventilation\n• Retrieval system & attendant\n• Appropriate PPE" },
      electrical: { title: "Electrical Energy", controls: "• Pre-start risk assessment\n• Isolation / LOTO\n• Verification of zero energy\n• Intrinsically safe practices" },
      heights: { title: "Working at Heights", controls: "• Pre-start risk assessment\n• Fall protection\n• Secure ladder or platform\n• Exclusion zones below" },
      traffic: { title: "Traffic / Site Access", controls: "• Pre-start risk assessment\n• Barriers\n• Communication with site staff\n• Exclusion zones" }
    };

    const modules = {
      1: { name: "Hazard Awareness", text: "Navigate the forecourt sections and identify hazards. Review the required controls for each." },
      2: { name: "Dispenser Isolation", text: "Go to the dispenser island. Prepare for service: Isolation/LOTO, zero energy, Ex-rated tools." },
      3: { name: "Confined Space Prep", text: "Navigate to the tank area. Prepare for entry: permit, gas testing, ventilation, retrieval, attendant, PPE." },
      4: { name: "ATG Inspection", text: "Go to the ATG / electrical section. Apply intrinsically safe practices." },
      5: { name: "Working at Heights", text: "Access the canopy area. Apply fall protection and exclusion zones." }
    };

    function setRegion(region) {
      document.getElementById("status").textContent = "Region: " + region.charAt(0).toUpperCase() + region.slice(1);
      const colors = { australia: "#0066CC", india: "#E67E22", thailand: "#27AE60", southafrica: "#2C3E50" };
      document.getElementById("canopy").setAttribute("color", colors[region] || "#0066CC");
    }

    function startModule(num) {
      const m = modules[num];
      document.getElementById("module-info").textContent = m.name + ": " + m.text;
      showPanel(m.name, m.text, "Navigate to the relevant section");
    }

    function showPanel(title, body, feedback) {
      document.getElementById("panel-title").setAttribute("value", title);
      document.getElementById("panel-body").setAttribute("value", body);
      document.getElementById("panel-feedback").setAttribute("value", feedback || "");
      document.getElementById("panel").setAttribute("visible", true);
      setTimeout(() => document.getElementById("panel").setAttribute("visible", false), 10000);
    }

    document.querySelector("a-scene").addEventListener("click", function(evt) {
      const el = evt.detail.intersection && evt.detail.intersection.object.el;
      if (!el || !el.classList.contains("clickable")) return;
      const type = el.getAttribute("data-hazard");
      if (!type || !hazards[type]) return;
      const h = hazards[type];
      showPanel(h.title, "Required controls (universal language):\n" + h.controls, "Correct — these apply in all regions");
    });
  </script>
</body>
</html>
